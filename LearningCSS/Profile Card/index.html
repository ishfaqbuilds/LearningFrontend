<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="profile_card">

      <div class="cover_image">
        <img src="coverImg.jpeg" alt="Cover Image" class="cover_img" />
      </div>

      <div class="profile_top">

        <div class="image">
          <img src="Profile.jpg" alt="Profile Image" class="profile_img" />
        </div>

        <button class="follow_button">Follow</button>
      </div>

      <div class="profile_data">

        <span class="name">IshfaqBuilds</span>
        <span class="job">Full Stack Developer</span>

        <p class="description">
          Building websites and learning modern web development, with a focus on creating clean, useful, and responsive experiences.
        </p>

        <div class="stats">
          <span><strong>500</strong> Following</span>
          <span><strong>22.2K</strong> Followers</span>
        </div>

      </div>
    </div>
  </body>
</html>
